name: check-sample-version-bumps

# Two jobs:
#   - tests: runs the check's unit tests
#   - check: runs scripts/check_sample_version_bumps.py against the PR's
#     diff vs the base branch. Fails if any agents/<slug>/ has changes
#     without a corresponding `version:` bump in sample.yaml — without
#     which release-samples.yml silently skips re-releasing.

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "scripts/check_sample_version_bumps.py"
      - "scripts/test_check_sample_version_bumps.py"
      - ".github/workflows/check-sample-version-bumps.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to defend against tag mutability — match the convention
      # used by check-sample-artifacts.yml. Bump deliberately.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Pinned to match check-sample-artifacts.yml.
        run: pip install pyyaml==6.0.2

      - name: Run unit tests
        run: python3 scripts/test_check_sample_version_bumps.py

  check:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Need history to diff agents/ vs the base branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml==6.0.2

      - name: Check version bumps for changed samples
        # Route github.base_ref through env: rather than interpolating
        # directly into the run: body. Inside double-quotes, bash still
        # expands $(...) and backticks, so a context value spliced into
        # the script line could execute on the runner. Routing through
        # env: makes the value visible to the shell as data, not code.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_sample_version_bumps.py "origin/${BASE_REF}"
