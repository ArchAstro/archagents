name: check-sample-version-bumps

# Fails PRs where an existing sample under agents/ or solutions/ changed
# without a corresponding version bump in <root>/<slug>/sample.yaml.

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "solutions/**"
      - ".github/workflows/check-sample-version-bumps.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to match this repo's checkout convention.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: ArchAstro/archastro-github-actions/check-version-bumps@v1
        with:
          solution-roots: agents,solutions
