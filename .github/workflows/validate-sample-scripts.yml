name: validate-sample-scripts

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "install.sh"
      - "scripts/sample_tool.py"
      - "scripts/_sample_lib/**"
      - "scripts/test_sample_tool.py"
      - ".github/workflows/validate-sample-scripts.yml"
  pull_request_target:
    branches: [main]
    paths:
      - "agents/**"
      - "install.sh"
      - "scripts/sample_tool.py"
      - "scripts/_sample_lib/**"
      - "scripts/test_sample_tool.py"
      - ".github/workflows/validate-sample-scripts.yml"
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "install.sh"
      - "scripts/sample_tool.py"
      - "scripts/_sample_lib/**"
      - "scripts/test_sample_tool.py"
      - ".github/workflows/validate-sample-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Run validator unit tests
        run: uv run scripts/test_sample_tool.py

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    # Gate on tests when the `tests` job actually ran (push, workflow_dispatch).
    # On pull_request_target the `tests` job is skipped because checking out
    # PR head into a privileged context would defeat the trusted/untrusted
    # split — the validate job still runs its own inline tests step from
    # trusted-source/ before shelling out to the CLI, so coverage is intact.
    # `!cancelled()` lets us proceed when needs.tests.result is `skipped`,
    # and the result != 'failure' check still blocks on a real failure.
    if: |
      !cancelled()
      && needs.tests.result != 'failure'
      && github.event_name != 'pull_request'
    env:
      # Required secrets: ARCHASTRO_CI_ACCESS_TOKEN, ARCHASTRO_CI_APP_ID.
      # Optional var: ARCHASTRO_CI_APP_NAME.
      ARCHASTRO_DEV_API_URL: https://platform.archastro.ai
    steps:
      - name: Checkout trusted validation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted-source
          persist-credentials: false

      - name: Checkout sample source
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: sample-source
          persist-credentials: false

      - name: Checkout pull request sample source
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: sample-source
          persist-credentials: false

      - name: Check required CI secrets
        env:
          ARCHASTRO_CI_ACCESS_TOKEN: ${{ secrets.ARCHASTRO_CI_ACCESS_TOKEN }}
          ARCHASTRO_CI_APP_ID: ${{ secrets.ARCHASTRO_CI_APP_ID }}
        run: |
          set -euo pipefail

          missing=0
          for name in ARCHASTRO_CI_ACCESS_TOKEN ARCHASTRO_CI_APP_ID; do
            if [[ -z "${!name}" ]]; then
              echo "${name} secret is required." >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "::add-mask::${ARCHASTRO_CI_ACCESS_TOKEN}"

      - name: Install uv
        # `--project trusted-source` below points uv at the
        # pyproject.toml + uv.lock that came with the trusted checkout,
        # since this job has two separate checkouts (trusted-source/
        # for validator code, sample-source/ for untrusted sample data)
        # and the runner cwd isn't a project root.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Run trusted validator unit tests
        run: uv run --project trusted-source trusted-source/scripts/test_sample_tool.py

      - name: Install ArchAgents CLI from public release
        env:
          ARCHAGENT_INSTALL_DIR: ${{ runner.temp }}/bin
          ARCHAGENT_RELEASE_BASE_URL: https://github.com/ArchAstro/archagents/releases/latest/download
          ARCHAGENT_INSTALL_SKIP_COMPLETIONS: "true"
          ARCHAGENT_INSTALL_SKIP_PATH_UPDATE: "true"
        run: |
          set -euo pipefail

          bash trusted-source/install.sh
          echo "${ARCHAGENT_INSTALL_DIR}" >> "$GITHUB_PATH"
          "${ARCHAGENT_INSTALL_DIR}/archagent" --version

      - name: Configure CLI credentials
        env:
          ARCHASTRO_CI_ACCESS_TOKEN: ${{ secrets.ARCHASTRO_CI_ACCESS_TOKEN }}
          ARCHASTRO_CI_APP_ID: ${{ secrets.ARCHASTRO_CI_APP_ID }}
          ARCHASTRO_CI_APP_NAME: ${{ vars.ARCHASTRO_CI_APP_NAME || 'ArchAgents CI Validator' }}
        run: |
          set -euo pipefail

          if [[ -z "${ARCHASTRO_CI_ACCESS_TOKEN}" ]]; then
            echo "ARCHASTRO_CI_ACCESS_TOKEN secret is required." >&2
            exit 1
          fi
          if [[ -z "${ARCHASTRO_CI_APP_ID}" ]]; then
            echo "ARCHASTRO_CI_APP_ID secret is required." >&2
            exit 1
          fi

          archagent auth set-credentials \
            --access-token "${ARCHASTRO_CI_ACCESS_TOKEN}" \
            --app-id "${ARCHASTRO_CI_APP_ID}" \
            --app-name "${ARCHASTRO_CI_APP_NAME}" \
            --server "${ARCHASTRO_DEV_API_URL}"

      - name: Validate sample scripts against production
        run: uv run --project trusted-source trusted-source/scripts/sample_tool.py validate --repo-root sample-source --cli archagent
