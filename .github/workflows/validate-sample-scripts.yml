name: validate-sample-scripts

# Offline validation for samples under agents/ + solutions/. Platform-backed
# validation happens when solution samples are released and deployed by
# release-samples.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "solutions/**"
      - ".github/workflows/validate-sample-scripts.yml"
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "solutions/**"
      - ".github/workflows/validate-sample-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ArchAstro/archastro-github-actions/setup-archagent@v1

      - uses: ArchAstro/archastro-github-actions/validate-solutions@v1
        with:
          solution-roots: agents,solutions
          mode: schema-only
