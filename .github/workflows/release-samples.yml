name: release-samples

# For every sample, if the version declared in <root>/<slug>/sample.yaml
# does not yet have a corresponding GitHub Release, cut one with the
# whole sample directory packaged as <slug>-<version>.tar.gz. <root>
# is `agents/` for runtime agent samples or `solutions/` for catalog
# Solution bundles (the convention-suffixed `-sample` directory).
#
# Runs on every push to main. Idempotent: re-running with no version
# bumps is a no-op (the release-exists check short-circuits).
#
# On the first run after this workflow lands, it will cut v0.1.0 for
# every sample — no manual bootstrap step.

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "solutions/**"
      - ".github/workflows/release-samples.yml"
  # Manual trigger so we can re-run if a release was deleted or the
  # workflow code changes after a sample was merged.
  workflow_dispatch:

# Required for `gh release create`. The default GITHUB_TOKEN has read-only
# contents perm on PRs but is granted write on push events to main.
permissions:
  contents: write

jobs:
  # Gate the release on the sample_tool test suite. A failing test
  # almost always means the packager or validator is broken — cutting
  # a release on top of that ships a tarball nobody can install. Same
  # 50-test suite check-sample-artifacts.yml runs on every PR.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Run sample_tool unit tests
        run: uv run scripts/test_sample_tool.py

  release:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Cut releases for any new sample versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Inline shell rather than a separate script: the loop is short,
        # the failure surface is small, and the logic stays visible in
        # the workflow file. If this grows past ~30 lines, lift it into
        # scripts/release_samples.sh.
        run: |
          set -euo pipefail

          # Each line of the printed plan is `<root>/<slug> <version>`,
          # so the loop below can derive the on-disk path + the tag in
          # one pass. SAMPLE_ROOTS lives in scripts/_sample_lib/paths.py
          # — keep it the single source of truth.
          mapfile -t samples < <(
            uv run python -c "
          import pathlib, yaml
          for root_name in ('agents', 'solutions'):
              root = pathlib.Path(root_name)
              if not root.is_dir():
                  continue
              for d in sorted(root.iterdir()):
                  if not d.is_dir():
                      continue
                  sample_yaml = d / 'sample.yaml'
                  if not sample_yaml.exists():
                      continue
                  data = yaml.safe_load(sample_yaml.read_text())
                  print(f\"{root_name}/{d.name} {data['version']}\")
          "
          )

          for entry in "${samples[@]}"; do
            sample_path="${entry%% *}"           # e.g. solutions/security-triage-agent-sample
            version="${entry##* }"
            slug="${sample_path##*/}"            # tarball + tag name from basename only
            tag="${slug}-${version}"
            tarball="${slug}-${version}.tar.gz"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "✓ $tag already released, skipping"
              continue
            fi

            echo "→ cutting release $tag from $sample_path"
            # Delegate to scripts/sample_tool.py pack so the local
            # `archastro install sample ./<tarball>` smoke-test path
            # and the CI release path produce the same archive. pack
            # validates sample.yaml first, then writes <slug>-<version>.tar.gz
            # into --output-dir. The consumer (CLI's `install agentsample`,
            # portal's full-deploy) streams the tarball in-memory and
            # runs sample.yaml's steps: block via @archastro/samples-catalog's
            # DSL executor — no files land on disk.
            uv run scripts/sample_tool.py pack "$sample_path" --output-dir .

            # --latest=false is load-bearing: without it, `gh release create`
            # auto-promotes each new release to "Latest", which steals the
            # flag from the CLI's vX.Y.Z release. install.sh resolves
            # releases/latest/download/SHA256SUMS for the CLI binary; a
            # sample release hijacking that URL 404s the installer for
            # every new user until someone notices and flips it back.
            # Sample releases are independently versioned per slug — there
            # is no meaningful "latest sample" at the repo level.
            gh release create "$tag" "$tarball" \
              --title "$slug $version" \
              --notes "Released from sample.yaml in commit ${GITHUB_SHA}." \
              --latest=false

            rm -f "$tarball"
          done
