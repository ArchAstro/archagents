name: release-samples

# For every sample under agents/ or solutions/, create the missing
# <slug>-<version>.tar.gz GitHub Release for the version in sample.yaml.
# The reusable action is idempotent: existing releases are skipped.

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "solutions/**"
      - ".github/workflows/release-samples.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ArchAstro/archastro-github-actions/setup-archagent@v1

      - uses: ArchAstro/archastro-github-actions/release-solutions@v1
        with:
          solution-roots: agents,solutions
          github-token: ${{ secrets.GITHUB_TOKEN }}
