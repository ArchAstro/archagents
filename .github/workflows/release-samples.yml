name: release-samples

# For every sample under agents/ or solutions/, if the version declared in
# <root>/<slug>/sample.yaml does not yet have a corresponding GitHub
# Release, cut one with the whole sample directory packaged as
# <slug>-<version>.tar.gz.
#
# Runs on every push to main. Idempotent: re-running with no version bumps
# is a no-op (the release-exists check short-circuits).
#
# Packaging is done by the archastro CLI (`package solution`) — the developer
# CLI used across the sample CI; it runs offline (no credentials). Consumers
# import the released tarball via `archagent import solution ./<tarball>`;
# both share the same bundle format, so the artifacts match. Requires a CLI
# release that ships `archastro package solution`.

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "solutions/**"
      - ".github/workflows/release-samples.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install archastro CLI
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/bin"
          curl -fsSL -o "${{ runner.temp }}/archastro.tar.gz" \
            "https://github.com/ArchAstro/archastro/releases/latest/download/archastro-linux-x64.tar.gz"
          tar -xzf "${{ runner.temp }}/archastro.tar.gz" -C "${{ runner.temp }}/bin"
          chmod +x "${{ runner.temp }}/bin/archastro"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Cut releases for any new sample versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          for sample in agents/*/sample.yaml solutions/*/sample.yaml; do
            dir="$(dirname "$sample")"          # e.g. solutions/security-triage-agent-sample
            slug="$(basename "$dir")"           # tarball + tag name from basename only

            version="$(grep -E '^version:' "$sample" | head -1 \
              | sed -E 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/')"
            if [ -z "$version" ]; then
              echo "::warning::$dir has no version: in sample.yaml, skipping"
              continue
            fi

            tag="${slug}-${version}"
            tarball="${slug}-${version}.tar.gz"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "✓ $tag already released, skipping"
              continue
            fi

            echo "→ cutting release $tag from $dir"
            # `package solution` validates the sample, then writes the
            # tarball into --output-dir. Works for both agent-mode
            # (agents/) and solution-mode (solutions/) bundles. Offline —
            # no credentials needed.
            archastro package solution "$dir" --output-dir .

            # --latest=false is load-bearing: without it `gh release create`
            # auto-promotes each new release to "Latest", stealing the flag
            # from the CLI's own vX.Y.Z release that install.sh resolves.
            gh release create "$tag" "$tarball" \
              --title "$slug $version" \
              --notes "Released from sample.yaml in commit ${GITHUB_SHA}." \
              --latest=false

            rm -f "$tarball"
          done
