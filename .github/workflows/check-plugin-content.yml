name: check-plugin-content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to defend against tag mutability in the supply chain.
      # A compromised tag could otherwise execute arbitrary code in CI.
      # Bump deliberately when needed.
      #
      # fetch-depth: 0 is required by check_version_bump_on_content_change,
      # which diffs against origin/<base>. A shallow clone (depth=1) does
      # not create the remote tracking branch for origin/main on PR events.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        # Pulls Python from .python-version and resolves deps from
        # pyproject.toml/uv.lock at the repo root. pyyaml stays pinned
        # to 6.0.2 there.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Run generator unit tests
        run: uv run scripts/test_generate_plugin_content.py

      - name: Run repo-validation unit tests
        run: uv run scripts/test_check_plugin_repo.py

      - name: Run repo-validation checks
        run: uv run scripts/check_plugin_repo.py

      - name: Verify generated plugin content is in sync with sources/
        run: uv run scripts/generate-plugin-content.py --check
