name: check-sample-artifacts

# Fails if the committed samples.json is out of date — i.e. if regenerating
# it from the current agents/ + solutions/ sample.yaml files would change
# it. Forces authors to regenerate and commit the manifest before merging:
#
#   archastro create solutionmanifest
#
# Requires a CLI release that ships `archastro create solutionmanifest`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install archastro CLI
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/bin"
          curl -fsSL -o "${{ runner.temp }}/archastro.tar.gz" \
            "https://github.com/ArchAstro/archastro/releases/latest/download/archastro-linux-x64.tar.gz"
          tar -xzf "${{ runner.temp }}/archastro.tar.gz" -C "${{ runner.temp }}/bin"
          chmod +x "${{ runner.temp }}/bin/archastro"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Check samples.json is up to date
        run: archastro create solutionmanifest --check
