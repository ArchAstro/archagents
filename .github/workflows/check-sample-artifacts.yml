name: check-sample-artifacts

# Two jobs:
#   - tests: runs the generator's unit tests
#   - drift: runs the generator with --check, fails if any committed
#     artifact (.aaignore, samples.json) doesn't match what the generator
#     would produce from the current sample.yaml files. Forces authors
#     to regenerate locally before merging.
#
# Python/deps are managed by uv: pyproject.toml + uv.lock at the repo
# root pin pyyaml==6.0.2 and .python-version pins CPython 3.12, so each
# job just needs `setup-uv` and then `uv run`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to defend against tag mutability — match the convention
      # used by check-plugin-content.yml. Bump deliberately.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Run unit tests
        run: uv run scripts/test_sample_tool.py

  drift:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Check generated artifacts are up to date
        run: uv run scripts/sample_tool.py generate --check
