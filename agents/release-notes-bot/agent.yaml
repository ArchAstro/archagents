kind: AgentTemplate
agent_key: release-notes-bot
name: Release Notes Bot
identity: |
  You draft the weekly changelog. Once a week, you scan the merged PRs
  from the past 7 days and produce a clean, human-readable release
  notes draft.

  ## Workflow

  1. Call `list_merged_prs` with `days=7`
  2. Group the PRs by category:
     - **Highlights**: 1-3 most user-visible / impactful changes (your judgment)
     - **Features**: PRs prefixed with `feat:` or labeled `enhancement`
     - **Fixes**: PRs prefixed with `fix:` or labeled `bug`
     - **Breaking changes**: PRs labeled `breaking-change` or with "BREAKING" in title/body
     - **Internal/maintenance**: `chore:`, `refactor:`, `test:`, `docs:`, `ci:`
  3. For each entry, write 1 sentence describing the user-facing impact
     (NOT the implementation). Use the PR body for context, not just the title.
  4. Skip noise: dependency bumps without behavior changes, formatting-only PRs,
     pure refactors that don't ship behavior
  5. Call `create_github_issue` to file the draft as a GitHub issue with
     labels `[release-notes, draft]` in the BRIEF_REPO

  ## Format the changelog

  ```
  # Release Notes Draft — Week of YYYY-MM-DD

  ## ✨ Highlights
  - <highlight 1> (#1234)
  - <highlight 2> (#5678)

  ## Features
  - <feature> (#1234)

  ## Fixes
  - <fix> (#5678)

  ## Breaking changes
  - <breaking change with migration note> (#9012)

  ## Internal
  - <maintenance> (#1111)

  ---
  *Generated from N merged PRs between YYYY-MM-DD and YYYY-MM-DD.*
  ```

  ## Voice

  - Write for users, not for engineers
  - One sentence per entry
  - Skip implementation details ("rewrote the X module")
  - Highlight impact ("X is now Y times faster", "you can now do Z")
  - For breaking changes, ALWAYS include the migration step

  ## Memory

  After filing the draft, `memory_store` the date range so the next
  run knows where to start. Use collection `"release_notes_runs"`.

tools:
  - tool_type: builtin
    builtin_tool_key: long_term_memory
    status: active
  - tool_type: builtin
    builtin_tool_key: memory
    status: active

  - tool_type: custom
    name: list_merged_prs
    description: List PRs merged into a base branch in the last N days
    parameters:
      type: object
      properties:
        owner: { type: string }
        repo: { type: string }
        base: { type: string, default: "main" }
        days: { type: integer, default: 7 }
        per_page: { type: integer, default: 50 }
      required: [owner, repo]
    handler_type: script
    config_ref: list-merged-prs
    status: active

  - tool_type: custom
    name: create_github_issue
    description: File the changelog draft as a GitHub issue
    parameters:
      type: object
      properties:
        owner: { type: string }
        repo: { type: string }
        title: { type: string }
        body: { type: string }
        labels: { type: array, items: { type: string } }
      required: [owner, repo, title, body]
    handler_type: script
    config_ref: rn-create-github-issue
    status: active

routines:
  - name: Participate in conversations
    description: Join threads when added so users can request ad hoc release notes.
    handler_type: preset
    preset_name: participate
    event_type: thread.session.join
    event_config:
      thread.session.join:
        filters: {}
    status: active

  - name: weekly-release-notes
    description: Draft a weekly changelog from merged PRs
    handler_type: preset
    preset_name: do_task
    event_type: schedule.cron
    schedule: "0 10 * * 1"
    preset_instructions: |
      Generate this week's release notes draft.

      1. Call list_merged_prs with days=7
      2. Group and categorize per the workflow in your identity
      3. File the draft via create_github_issue with labels [release-notes, draft]
      4. memory_store the date range
    status: active

installations:
  - install_type: memory/long-term
    config: {}
  - install_type: archastro/thread
    config: {}
  - install_type: integration/github
    config: {}

# Post-install checklist. The platform materializes one
# agent_health_actions row per entry on install; users see a
# "Finish setup" panel that burns down as they resolve each item.
# Verifiers re-run on a daily sweep so a deleted secret or revoked
# install transitions back to :degraded.
setup_requirements:
  # Required env vars — all stored on this specific agent. Per-agent
  # scope is the only one bundle authors can declare: the user who
  # installed the agent always has write access to its env vars,
  # whereas org/app secret stores typically require admin permissions
  # most installers don't have.
  - kind: env_var
    key: GITHUB_TOKEN
    scope: agent_env_var
    secret: true
    description: |
      GitHub token used by this sample's custom scripts to list merged
      PRs and create draft issues. Prefer a fine-grained PAT with Pull
      requests: read, Issues: read/write, and Metadata: read. A
      classic `repo` token also works but is broader.
    example: "ghp_xxxxxxxxxxxx"

  - kind: env_var
    key: REPO_OWNER
    scope: agent_env_var
    description: "GitHub org/user that owns the repo to draft notes for."

  - kind: env_var
    key: REPO_NAME
    scope: agent_env_var
    description: "Repo name to scan for merged PRs and to file the draft issue in."

  - kind: env_var
    key: RELEASE_BRANCH
    scope: agent_env_var
    description: |
      Branch to track for "merged" PRs. Defaults to `main` if unset.

  # Required install — the GitHub App installation used for repo
  # enablement. The sample's custom scripts still use GITHUB_TOKEN
  # for GitHub REST calls.
  - kind: install
    installation_kind: integration/github
    description: |
      Install the ArchAstro GitHub App on `REPO_OWNER/REPO_NAME`.
      Without this, the repo is not enabled for ArchAgents GitHub
      integration events and tools.

  # Custom verifier — confirms the bot can list closed PRs against
  # the configured release branch. Catches the common "wrong repo
  # name" and "PAT scope too narrow" failure modes.
  - kind: custom
    id: verify-merged-prs-readable
    title: "Verify the bot can read merged PRs"
    description: |
      Hits `/repos/{REPO_OWNER}/{REPO_NAME}/pulls?state=closed&base={RELEASE_BRANCH}`
      with `GITHUB_TOKEN` to confirm the bot can list merged PRs on
      the configured branch.
    verify:
      script_ref: verify-merged-prs-readable
    depends_on: [GITHUB_TOKEN, REPO_OWNER, REPO_NAME]

metadata:
  category: engineering
  version: "1.0"
