kind: AgentTemplate
agent_key: platform-health-agent
name: Platform Health Agent
description: >-
  Monitors a configured GitHub repository for issue, CI, and production-health
  signals. It produces concise reports, flags patterns, suggests ownership, and
  comments when evidence shows an issue may already be resolved.
identity: |
  You are Platform Health, a monitoring agent for a single GitHub repository
  configured via the `MONITORED_REPO` environment variable.

  Your responsibilities:
  1. Track open GitHub issues and surface new or critical ones
  2. Monitor CI/CD pipeline failures from GitHub Actions
  3. Provide concise daily summaries of repository health
  4. Categorize and prioritize issues by severity and theme
  5. Track patterns across issues (e.g., recurring failures, issue spikes, unassigned items)
  6. Cross-reference open issues against merged PRs to identify issues that may already be resolved
  7. For unassigned issues, suggest an owner based on who has authored related PRs or owns the relevant code area

  When evaluating whether an open issue might be resolved:
  - Check if the issue links to or mentions a PR, and whether that PR has been merged
  - Read comments on linked PRs for signals like "this fixes #X" or "once #Y merges, this should be green"
  - Verify the issue is still OPEN on GitHub before listing — if it's already CLOSED, skip (there's nothing to suggest).
  - DO NOT close the issue. Instead, post a comment on the issue summarizing the resolution evidence using `github_create_issue_comment` (auto-exposed by the `integrations` builtin via the `enablement/github_app` install — auth uses the GitHub App's installation token, not the read-only `GITHUB_TOKEN` PAT).
  - Before commenting, check working memory for `commented_on_issue_<N>` (KV, not vector-search). If a marker is set, skip — you've already posted. After commenting, set `commented_on_issue_<N>` so you don't duplicate the comment tomorrow.

  Communication style:
  - Lead with what needs attention — failures and new issues first
  - Be concise — use bullet points and short summaries
  - Include links to issues and failed runs so they're easy to follow up on
  - Flag patterns (e.g., recurring failures, issue spikes, items without assignees)
  - When asked for a health report, group issues by category and note trends
  - For unassigned issues, suggest who should own them with a brief rationale

tools:
  - tool_type: builtin
    builtin_tool_key: search
    status: active
  - tool_type: builtin
    builtin_tool_key: knowledge_search
    status: active
  - tool_type: builtin
    builtin_tool_key: long_term_memory
    status: active
  - tool_type: builtin
    builtin_tool_key: memory
    status: active
  - tool_type: builtin
    builtin_tool_key: artifacts
    status: active
  - tool_type: builtin
    builtin_tool_key: skills
    status: active
  # Required: the `integrations` builtin auto-exposes per-install agent
  # tools at runtime — `enablement/slack_bot` becomes a "Slack Bot" agent
  # tool, and `enablement/github_app` exposes `github_create_issue_comment`,
  # `github_create_pull_request_review_comment`, and the rest of the GitHub
  # tool surface used by Calvin and the daily-report commenting flow.
  # Without this, the agent has no callable surface for those integrations.
  - tool_type: builtin
    builtin_tool_key: integrations
    status: active

routines:
  - name: Participate in conversations
    description: Join monitored threads and generate responses to script-posted prompts
    handler_type: preset
    preset_name: participate
    event_type: thread.session.join
    event_config:
      thread.session.join: {}
    status: active

  - name: Daily Health Report Prompt
    description: |
      Cron-fires once per morning. Posts a prompt to the `health-reports`
      thread, which triggers the agent (via the participate routine) to
      generate today's report. The script reads the previous day's
      continuity summary from `storage` (key `last_report_summary`) and
      embeds it as starting context.
    handler_type: script
    config_ref: ph-health-report-prompt
    event_type: schedule.cron
    event_config:
      schedule.cron: {}
    schedule: "5 9 * * *"
    status: active

  - name: GitHub Event Alert
    description: |
      Reacts to GitHub webhook events (issues opened/closed/reopened, PR
      closed+merged, CI failures) by prompting the agent in the
      `health-alerts` thread. Memory-gated: new problems write
      `alerted_issue_<N>` / `alerted_ci_*` keys via `working_memory_set`;
      closures look up the matching key and only post a "✅ resolved"
      update on a hit. For issue close/reopen events the script
      pre-fetches memory state via `storage.get` and embeds it in the
      prompt to remove an LLM tool call.
    handler_type: script
    config_ref: ph-github-event-alert
    event_type: webhook.github_app.*
    event_config:
      webhook.github_app.*: {}
    status: active

  - name: 5xx Daily Digest
    description: |
      Cron-fires once per afternoon. Queries Cloud Logging for the last 24h
      of ERROR-severity entries in the configured K8s namespace, groups by
      Elixir exception class, pre-fetches recent open issues and merged PRs,
      and prompts the agent (via participate on the `5xx-digest` thread) to
      format a Slack post with per-signature drill-down URLs into the Cloud
      Logging Console. The agent makes ZERO additional tool calls — all
      data is in the prompt — to keep the turn fast.
    handler_type: script
    config_ref: ph-5xx-digest
    event_type: schedule.cron
    event_config:
      schedule.cron: {}
    schedule: "30 14 * * *"
    status: active

  - name: Slack Delivery
    description: |
      Forwards agent responses from monitored threads (health-reports,
      health-alerts, 5xx-digest) to the configured Slack output channel.
      Strips `<thought>`, `<thinking>`, and `<summary>` blocks; suppresses
      `SKIP:`-prefixed responses; guards against tool-call leakage.
    handler_type: script
    config_ref: ph-deliver
    event_type: thread.message_added
    event_config:
      thread.message_added: {}
    status: active

  - name: Continuity Capture
    description: |
      Captures the trailing `<summary>...</summary>` block from agent
      responses on monitored threads and writes it to `storage` (3-day TTL)
      under a per-thread key. Tomorrow's prompter reads the matching key
      as continuity context. Branches by `thread.key` so the daily report
      and 5xx digest share one capture script.
    handler_type: script
    config_ref: ph-capture
    event_type: thread.message_added
    event_config:
      thread.message_added: {}
    status: active

  - name: Auto-capture memories
    description: Automatically extract and store key facts after conversations
    handler_type: preset
    preset_name: auto_memory_capture
    event_type: thread.session.leave
    event_config:
      thread.session.leave:
        subject_is_agent: true
    status: active

installations:
  - install_type: memory/long-term
    config: {}
  - install_type: archastro/thread
    config: {}
  # GitHub App enablement: receives webhook.github_app.* events AND exposes
  # `github_create_issue_comment` etc. via the `integrations` builtin so
  # the agent can post resolution comments using the App's installation
  # token (broad write capability) rather than the read-only PAT.
  # Same install kind calvin-bot-v3 uses for PR review commenting.
  # After deploy, install the ArchAstro GitHub App on `MONITORED_REPO`.
  - install_type: enablement/github_app
    config: {}
  # Slack bot for posting messages. Required for the Slack Delivery routine.
  # `slack.send` is provided by the slack_bot install. Sister samples
  # (security-triage-agent, threat-intel-agent) use the same kind name.
  - install_type: enablement/slack_bot
    config: {}

# Post-install checklist. The platform materializes one
# agent_health_actions row per entry on install; users see a
# "Finish setup" panel that burns down as they resolve each item.
# Verifiers re-run on a daily sweep so a deleted secret or revoked
# install transitions back to :degraded.
setup_requirements:
  # Required env vars — all stored on this specific agent. Per-agent
  # scope is the only one bundle authors can declare: the user who
  # installed the agent always has write access to its env vars,
  # whereas org/app secret stores typically require admin permissions
  # most installers don't have.
  - kind: env_var
    key: GITHUB_TOKEN
    scope: agent_env_var
    secret: true
    description: |
      PAT used to read issues, PRs, and PR comments. The sample does
      not write to GitHub — for strict minimum privilege, prefer a
      fine-grained PAT (`github_pat_*`) with read-only access to
      Issues, Pull requests, and Metadata. A classic `repo`-scoped
      PAT (`ghp_*`) also works.
    example: "ghp_xxxxxxxxxxxx"

  - kind: env_var
    key: MONITORED_REPO
    scope: agent_env_var
    description: |
      The repo to monitor in `owner/name` format. The agent only acts
      on events from this repo; other repos receiving events from the
      same GitHub App install are silently ignored.

  - kind: env_var
    key: SLACK_OUTPUT_CHANNEL
    scope: agent_env_var
    description: |
      Slack channel that receives the daily report, GitHub event
      alerts, and the 5xx digest. Include the leading `#` (e.g.
      `#platform-health`).

  # --- Cloud Logging (gates the 5xx daily digest) ---
  # All four of these are required together. Skipping any of them
  # disables the 5xx digest routine while leaving the daily report
  # and GitHub event alerts working.
  - kind: env_var
    key: GCLOUD_PROJECT_ID
    scope: agent_env_var
    description: |
      GCP project ID hosting the namespace whose logs the digest
      should scan. Required for the 5xx digest.

  - kind: env_var
    key: LOG_NAMESPACE
    scope: agent_env_var
    description: |
      Kubernetes namespace whose ERROR-severity logs the digest
      scans. Required for the 5xx digest.

  - kind: env_var
    key: GCLOUD_SA_CLIENT_EMAIL
    scope: agent_env_var
    description: |
      Service account `client_email` from the SA JSON key. Used to
      mint a Cloud Logging access token via JWT-bearer grant on every
      run. Required for the 5xx digest.

  - kind: env_var
    key: GCLOUD_SA_PRIVATE_KEY
    scope: agent_env_var
    secret: true
    description: |
      Service account `private_key` (PEM) from the SA JSON key. Escape
      newlines as literal `\n`. Required for the 5xx digest. SA needs
      `logging.viewer` (read-only) on `GCLOUD_PROJECT_ID`.

  # Optional — narrows the 5xx digest to specific containers. Without
  # this, the digest catches ALL ERROR-severity logs in the namespace
  # (sidecars, log agents, etc.) which often dominates volume and
  # drowns out real platform exceptions.
  - kind: env_var
    key: LOG_CONTAINERS
    scope: agent_env_var
    required: false
    description: |
      Comma-separated K8s container names to scope the 5xx digest to
      (e.g. `app,admin-app`). Empty/unset = no container filter.
      Strongly recommended for production namespaces.

  # Required installs — GitHub App receives PR/issue webhooks and
  # exposes the App-installation token for posting resolution
  # comments; Slack bot posts the daily report and event alerts.
  - kind: install
    installation_kind: enablement/github_app
    description: |
      Install the ArchAstro GitHub App on the `MONITORED_REPO`.
      Without this, the agent receives no GitHub events and can't
      post resolution comments.

  - kind: install
    installation_kind: enablement/slack_bot
    description: |
      Add the ArchAstro Slack bot to your workspace and invite it to
      `SLACK_OUTPUT_CHANNEL`. Without this, no daily report, event
      alerts, or 5xx digest will be posted.

  # Custom verifier — confirms the bot can actually read MONITORED_REPO.
  # Catches the common "PAT token mismatch with the repo's visibility
  # or org SSO" failure mode before the agent silently no-ops.
  - kind: custom
    id: verify-monitored-repo-access
    title: "Verify the bot can read the monitored repo"
    description: |
      Hits `/repos/{MONITORED_REPO}` with `GITHUB_TOKEN` to confirm
      the bot has read access. Surfaces the exact HTTP status if not.
    verify:
      script_ref: verify-monitored-repo-access
    depends_on: [GITHUB_TOKEN, MONITORED_REPO]

metadata:
  category: devops
  version: "1.0"
