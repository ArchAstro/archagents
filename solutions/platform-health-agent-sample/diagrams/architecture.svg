<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="-apple-system, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="title desc">
  <title id="title">Platform Health Agent Sample — Architecture</title>
  <desc id="desc">Three triggers (daily cron at 09:05 UTC, GitHub webhook, daily cron at 14:30 UTC) emit prompts into three dedicated threads. The agent responds; a delivery routine strips internal tags and forwards each response to Slack. A capture routine persists summaries for next-run continuity.</desc>
  <style>
    .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; rx: 6; ry: 6; }
    .input { fill: #ecfdf5; stroke: #047857; }
    .agent { fill: #eff6ff; stroke: #1d4ed8; }
    .routine { fill: #f5f3ff; stroke: #7c3aed; }
    .output { fill: #fef3c7; stroke: #b45309; }
    .label { fill: #111827; }
    .sublabel { fill: #4b5563; font-size: 11px; }
    .arrow { fill: none; stroke: #6b7280; stroke-width: 1.5; marker-end: url(#a); }
    .arrow-label { fill: #4b5563; font-size: 11px; font-style: italic; }
    .title { font-size: 16px; font-weight: 600; fill: #111827; }
    .legend-label { fill: #4b5563; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" class="title">Platform Health Agent Sample — Architecture</text>

  <rect class="box input" x="30" y="70" width="180" height="56"/>
  <text x="120" y="93" text-anchor="middle" class="label" font-weight="600">Daily health cron</text>
  <text x="120" y="112" text-anchor="middle" class="sublabel">5 9 * * * → health-reports</text>

  <rect class="box input" x="30" y="160" width="180" height="56"/>
  <text x="120" y="183" text-anchor="middle" class="label" font-weight="600">GitHub webhook</text>
  <text x="120" y="202" text-anchor="middle" class="sublabel">issues, PRs, CI failures</text>

  <rect class="box input" x="30" y="250" width="180" height="56"/>
  <text x="120" y="273" text-anchor="middle" class="label" font-weight="600">5xx digest cron</text>
  <text x="120" y="292" text-anchor="middle" class="sublabel">30 14 * * * → 5xx-digest</text>

  <rect class="box agent" x="270" y="120" width="200" height="160"/>
  <text x="370" y="148" text-anchor="middle" class="label" font-weight="600">Platform Health Agent</text>
  <text x="370" y="172" text-anchor="middle" class="sublabel">5 routines, 5 scripts</text>
  <text x="370" y="190" text-anchor="middle" class="sublabel">threads:</text>
  <text x="370" y="206" text-anchor="middle" class="sublabel">  • health-reports</text>
  <text x="370" y="222" text-anchor="middle" class="sublabel">  • health-alerts</text>
  <text x="370" y="238" text-anchor="middle" class="sublabel">  • 5xx-digest</text>
  <text x="370" y="262" text-anchor="middle" class="sublabel">summary capture → memory</text>

  <rect class="box routine" x="520" y="160" width="180" height="80"/>
  <text x="610" y="186" text-anchor="middle" class="label" font-weight="600">Delivery routine</text>
  <text x="610" y="208" text-anchor="middle" class="sublabel">strips &lt;thought&gt;, &lt;thinking&gt;,</text>
  <text x="610" y="224" text-anchor="middle" class="sublabel">&lt;summary&gt;; SKIP gate</text>

  <rect class="box output" x="750" y="170" width="60" height="60" rx="30" ry="30"/>
  <text x="780" y="195" text-anchor="middle" class="label" font-weight="600">Slack</text>
  <text x="780" y="212" text-anchor="middle" class="sublabel">channel</text>

  <path class="arrow" d="M210 98 C 240 98, 240 170, 270 170"/>
  <text x="244" y="130" class="arrow-label">prompt</text>

  <path class="arrow" d="M210 188 L 270 200"/>
  <text x="240" y="180" class="arrow-label">event</text>

  <path class="arrow" d="M210 278 C 240 278, 240 230, 270 230"/>
  <text x="244" y="270" class="arrow-label">prompt</text>

  <path class="arrow" d="M470 200 L 520 200"/>
  <text x="495" y="192" text-anchor="middle" class="arrow-label">response</text>

  <path class="arrow" d="M700 200 L 750 200"/>
  <text x="725" y="192" text-anchor="middle" class="arrow-label">post</text>

  <g transform="translate(30, 380)">
    <rect class="box input" x="0" y="0" width="14" height="14"/>
    <text x="22" y="11" class="legend-label">trigger / source</text>
    <rect class="box agent" x="130" y="0" width="14" height="14"/>
    <text x="152" y="11" class="legend-label">agent</text>
    <rect class="box routine" x="220" y="0" width="14" height="14"/>
    <text x="242" y="11" class="legend-label">routine</text>
    <rect class="box output" x="320" y="0" width="14" height="14"/>
    <text x="342" y="11" class="legend-label">output</text>
  </g>
</svg>
