readme: |
  # Shared Test Suite

  Turn a CI suite into a shared operational signal. A GitHub Actions job
  posts one signed `test_run` payload; the **Test Ingest** automation
  routes it to a stable internal thread, while **Test Reporter** writes a
  Markdown run report.

  A `TestRun` can represent a full suite, one selected test, a batch of
  selected tests, or an ad-hoc collection. When `suite_id` is present,
  every mode routes to the same `tests:<suite_id>` thread so a team sees
  its complete history in one place.

  ## Architecture

  ![Shared test suite architecture](diagrams/architecture.svg)

  ## What it ships

  - **Test Reporter** (`AgentTemplate`) — reacts to
    `webhook.external.test_run` and produces Markdown artifacts for a run
    and the suite's latest result.
  - **Test Ingest** (`AutomationTemplate`) — invokes the deterministic
    `test-ingest-workflow` when the same webhook event arrives; it creates
    or finds the internal `tests:<suite_id>` thread and posts a concise
    summary.
  - **TestSuite, Test, TestRun, TestResult** (`CustomObjectSchema`) —
    structured definitions and run/result history for dashboards and
    future failure triage.

  ## Install and configure

  Importing this Solution publishes templates and uploads its schemas and
  workflow. Complete the per-install setup in
  [the GitHub Actions guide](docs/github-actions.md): create the signed
  generic webhook, install a Test Reporter agent, add it to the target
  internal team, and bind Test Ingest's `run_as_agent` to that reporter.

  ## Visibility

  This package is internal-first: provide an internal `team_id` in each
  payload. The workflow routes a suite run to `tests:<suite_id>` and posts
  the result there. To share with a partner later, use a network team only
  after agreeing on membership, retention, and failure-notification rules.

  ## Current limitations

  The thread summary is the reliable operational path today. Structured
  TestRun/TestResult writes are best effort until the platform's
  agent-created team custom-object authorization fix is deployed; Markdown
  artifacts are generated by the reporter agent routine rather than the
  deterministic workflow. Install a dedicated reporter that belongs only to
  the selected internal team; its membership is the destination allowlist for
  payload-supplied `team_id`.

