<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="title desc">
  <title id="title">Cross-Org Collaboration Agent Sample — Architecture</title>
  <desc id="desc">A cross-org thread message reaches the agent. The agent reads private code via the GitHub App and drafts a structured response, which passes through five field guards (regex, substring, two cross-vendor LLM judges, self-attestation verifier) before posting to the thread.</desc>
  <style>
    .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; rx: 6; ry: 6; }
    .input { fill: #ecfdf5; stroke: #047857; }
    .agent { fill: #eff6ff; stroke: #1d4ed8; }
    .guard { fill: #fef3c7; stroke: #b45309; }
    .output { fill: #fef3c7; stroke: #b45309; }
    .label { fill: #111827; }
    .sublabel { fill: #4b5563; font-size: 11px; }
    .arrow { fill: none; stroke: #6b7280; stroke-width: 1.5; marker-end: url(#a); }
    .arrow-label { fill: #4b5563; font-size: 11px; font-style: italic; }
    .title { font-size: 16px; font-weight: 600; fill: #111827; }
    .legend-label { fill: #4b5563; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" class="title">Cross-Org Collaboration Agent Sample — Architecture</text>

  <rect class="box input" x="30" y="80" width="180" height="60"/>
  <text x="120" y="105" text-anchor="middle" class="label" font-weight="600">Cross-org thread message</text>
  <text x="120" y="124" text-anchor="middle" class="sublabel">partner asks a question</text>

  <rect class="box input" x="30" y="220" width="180" height="60"/>
  <text x="120" y="245" text-anchor="middle" class="label" font-weight="600">Your private repo</text>
  <text x="120" y="264" text-anchor="middle" class="sublabel">GitHub App, read-only</text>

  <rect class="box agent" x="270" y="130" width="180" height="100"/>
  <text x="360" y="158" text-anchor="middle" class="label" font-weight="600">Cross-Org Collab Agent</text>
  <text x="360" y="180" text-anchor="middle" class="sublabel">drafts structured response</text>
  <text x="360" y="196" text-anchor="middle" class="sublabel">+ safety_self_check</text>
  <text x="360" y="212" text-anchor="middle" class="sublabel">attestation</text>

  <rect class="box guard" x="500" y="60" width="220" height="240"/>
  <text x="610" y="84" text-anchor="middle" class="label" font-weight="600">Output pipeline (6 steps)</text>
  <text x="610" y="108" text-anchor="middle" class="sublabel">[1] Structured schema</text>
  <text x="610" y="130" text-anchor="middle" class="sublabel">[2] Regex guards</text>
  <text x="610" y="150" text-anchor="middle" class="sublabel">[3] Substring guards</text>
  <text x="610" y="170" text-anchor="middle" class="sublabel">[4] Judge #1 (Claude Haiku)</text>
  <text x="610" y="186" text-anchor="middle" class="sublabel">    blacklist semantic check</text>
  <text x="610" y="206" text-anchor="middle" class="sublabel">[5] Judge #2 (GPT-4o-mini)</text>
  <text x="610" y="222" text-anchor="middle" class="sublabel">    whitelist semantic check</text>
  <text x="610" y="242" text-anchor="middle" class="sublabel">[6] Judge #3 (Claude Haiku)</text>
  <text x="610" y="258" text-anchor="middle" class="sublabel">    verifies safety_self_check</text>
  <text x="610" y="284" text-anchor="middle" class="sublabel">any rejection → agent rewrites</text>

  <rect class="box output" x="500" y="330" width="220" height="60"/>
  <text x="610" y="355" text-anchor="middle" class="label" font-weight="600">Message posts to thread</text>
  <text x="610" y="374" text-anchor="middle" class="sublabel">only if all guards pass</text>

  <path class="arrow" d="M210 110 C 240 110, 240 160, 270 160"/>
  <text x="234" y="130" class="arrow-label">incoming message</text>

  <path class="arrow" d="M210 250 C 240 250, 240 200, 270 200"/>
  <text x="234" y="240" class="arrow-label">read code</text>

  <path class="arrow" d="M450 180 L 500 180"/>
  <text x="478" y="172" text-anchor="middle" class="arrow-label">draft</text>

  <path class="arrow" d="M610 300 L 610 330"/>
  <text x="660" y="318" text-anchor="middle" class="arrow-label">passes</text>

  <g transform="translate(30, 380)">
    <rect class="box input" x="0" y="0" width="14" height="14"/>
    <text x="22" y="11" class="legend-label">trigger / source</text>
    <rect class="box agent" x="130" y="0" width="14" height="14"/>
    <text x="152" y="11" class="legend-label">agent</text>
    <rect class="box output" x="220" y="0" width="14" height="14"/>
    <text x="242" y="11" class="legend-label">guard / output</text>
  </g>
</svg>
