readme: |
  # Customer Management

  Install this once into your own Slack workspace, then stamp one
  **Customer Success Agent** per customer relationship. Each stamped
  agent works in the shared Slack channel with a single customer: it
  answers grounded in that customer's context, stays strictly in that
  customer's scope, and keeps a durable memory of the account so every
  conversation resumes where the last one left off.

  ## Architecture

  ![Architecture overview](diagrams/architecture.svg)

  The deployable template is parameterized on `customer_label` — the
  customer identity is filled in when the agent is stamped for a specific
  customer, so each customer gets a clearly-named, single-scope agent
  (`Customer Success Agent — Acme`, `Customer Success Agent — Beta`, …).

  ## What the agent does

  - Answers a customer's product and account questions, grounded in the
    knowledge base and the thread — never from general knowledge.
  - Stays in one customer's scope: it never mentions, compares against, or
    leaks anything about another customer.
  - Keeps durable, date-stamped relationship memory so context carries
    across sessions.
  - Works in the customer's shared Slack channel and responds when added.

  ## The bundle

  One deployable AgentTemplate (`Customer Success Agent`). It uses builtin
  tools only — `knowledge_search`, `long_term_memory`, `memory`, `search`,
  `skills`, `tasks`, and `artifacts` — and ships no credentials.

