<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">Customer Management</text>

  <!-- Vendor org installs the solution once (level 2) -->
  <rect x="40" y="70" width="200" height="70" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="140" y="100" text-anchor="middle" fill="#3730a3" font-weight="600">Your Slack workspace</text>
  <text x="140" y="122" text-anchor="middle" fill="#4b5563">installs Customer Management</text>

  <!-- arrow -->
  <line x1="240" y1="105" x2="320" y2="105" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="320,100 332,105 320,110" fill="#9ca3af"/>
  <text x="286" y="96" text-anchor="middle" fill="#6b7280" font-size="12">stamp per customer</text>

  <!-- One Customer Success Agent per customer (level 3) -->
  <rect x="340" y="60" width="330" height="50" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="505" y="90" text-anchor="middle" fill="#065f46" font-weight="600">Customer Success Agent — Acme</text>

  <rect x="340" y="122" width="330" height="50" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="505" y="152" text-anchor="middle" fill="#065f46" font-weight="600">Customer Success Agent — Beta</text>

  <rect x="340" y="184" width="330" height="50" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="505" y="214" text-anchor="middle" fill="#065f46" font-weight="600">Customer Success Agent — …</text>

  <text x="360" y="272" text-anchor="middle" fill="#6b7280" font-size="12">Each agent works in one customer's shared Slack channel: in scope, grounded, with durable memory.</text>
</svg>
