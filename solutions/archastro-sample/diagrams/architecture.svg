<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="title desc">
  <title id="title">ArchAstro Sample — Architecture</title>
  <desc id="desc">User messages in a thread reach the concierge agent. Each turn either answers directly, hands off to a specialist agent, or escalates to Slack or email.</desc>
  <style>
    .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; rx: 6; ry: 6; }
    .input { fill: #ecfdf5; stroke: #047857; }
    .agent { fill: #eff6ff; stroke: #1d4ed8; }
    .output { fill: #fef3c7; stroke: #b45309; }
    .label { fill: #111827; }
    .sublabel { fill: #4b5563; font-size: 11px; }
    .arrow { fill: none; stroke: #6b7280; stroke-width: 1.5; marker-end: url(#a); }
    .arrow-label { fill: #4b5563; font-size: 11px; font-style: italic; }
    .title { font-size: 16px; font-weight: 600; fill: #111827; }
    .legend-label { fill: #4b5563; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" class="title">ArchAstro Sample — Architecture</text>

  <rect class="box input" x="30" y="150" width="180" height="60"/>
  <text x="120" y="175" text-anchor="middle" class="label" font-weight="600">User message</text>
  <text x="120" y="194" text-anchor="middle" class="sublabel">direct thread participation</text>

  <rect class="box agent" x="270" y="120" width="180" height="120"/>
  <text x="360" y="148" text-anchor="middle" class="label" font-weight="600">ArchAstro concierge</text>
  <text x="360" y="170" text-anchor="middle" class="sublabel">4 tools:</text>
  <text x="360" y="186" text-anchor="middle" class="sublabel">org_overview, describe_agent,</text>
  <text x="360" y="202" text-anchor="middle" class="sublabel">handoff, escalate</text>
  <text x="360" y="222" text-anchor="middle" class="sublabel">decides per turn</text>

  <rect class="box output" x="510" y="60" width="180" height="48"/>
  <text x="600" y="82" text-anchor="middle" class="label">Reply in thread</text>
  <text x="600" y="98" text-anchor="middle" class="sublabel">direct answer</text>

  <rect class="box output" x="510" y="130" width="180" height="48"/>
  <text x="600" y="152" text-anchor="middle" class="label">Handoff</text>
  <text x="600" y="168" text-anchor="middle" class="sublabel">specialist agent's thread</text>

  <rect class="box output" x="510" y="200" width="180" height="48"/>
  <text x="600" y="222" text-anchor="middle" class="label">Slack escalation</text>
  <text x="600" y="238" text-anchor="middle" class="sublabel">CONCIERGE_ESCALATION_CHANNEL</text>

  <rect class="box output" x="510" y="270" width="180" height="48"/>
  <text x="600" y="292" text-anchor="middle" class="label">Email escalation</text>
  <text x="600" y="308" text-anchor="middle" class="sublabel">CONCIERGE_ESCALATION_EMAIL</text>

  <path class="arrow" d="M210 180 L 270 180"/>
  <path class="arrow" d="M450 160 C 480 160, 480 84, 510 84"/>
  <path class="arrow" d="M450 175 L 510 154"/>
  <path class="arrow" d="M450 195 C 480 195, 480 224, 510 224"/>
  <path class="arrow" d="M450 215 C 480 215, 480 294, 510 294"/>

  <g transform="translate(30, 320)">
    <rect class="box input" x="0" y="0" width="14" height="14"/>
    <text x="22" y="11" class="legend-label">trigger / source</text>
    <rect class="box agent" x="130" y="0" width="14" height="14"/>
    <text x="152" y="11" class="legend-label">agent</text>
    <rect class="box output" x="220" y="0" width="14" height="14"/>
    <text x="242" y="11" class="legend-label">output</text>
  </g>
</svg>
