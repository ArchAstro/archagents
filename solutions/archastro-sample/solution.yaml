readme: |-
  # ArchAstro Sample

  The default ArchAstro project concierge.

  ## Architecture

  ![Architecture overview](diagrams/architecture.svg)

  ## What it ships

  - Deployable agent template under `agents/archastro-sample.yaml`
  - 4 standalone custom tool template(s) under `tools/`
  - Setup actions embedded directly on the agent and atomic templates

  ## Validate/import

  ```sh
  uv run scripts/sample_tool.py pack solutions/archastro-sample
  ```
