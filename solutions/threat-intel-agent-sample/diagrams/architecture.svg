<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="title desc">
  <title id="title">Threat Intelligence Agent Sample — Architecture</title>
  <desc id="desc">A daily cron routine (07:00 UTC) fans into Hacker News, GitHub Security Advisories, and your MONITORED_REPOS lockfiles. The agent cross-references findings against STACK_DESCRIPTION, dedups against past briefs in long-term memory, and emits a GitHub issue brief plus a Slack summary.</desc>
  <style>
    .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; rx: 6; ry: 6; }
    .input { fill: #ecfdf5; stroke: #047857; }
    .agent { fill: #eff6ff; stroke: #1d4ed8; }
    .output { fill: #fef3c7; stroke: #b45309; }
    .label { fill: #111827; }
    .sublabel { fill: #4b5563; font-size: 11px; }
    .arrow { fill: none; stroke: #6b7280; stroke-width: 1.5; marker-end: url(#a); }
    .arrow-label { fill: #4b5563; font-size: 11px; font-style: italic; }
    .title { font-size: 16px; font-weight: 600; fill: #111827; }
    .legend-label { fill: #4b5563; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" class="title">Threat Intelligence Agent Sample — Architecture</text>

  <rect class="box input" x="30" y="70" width="180" height="60"/>
  <text x="120" y="95" text-anchor="middle" class="label" font-weight="600">Daily cron</text>
  <text x="120" y="114" text-anchor="middle" class="sublabel">0 7 * * *</text>

  <rect class="box input" x="30" y="150" width="180" height="60"/>
  <text x="120" y="175" text-anchor="middle" class="label" font-weight="600">Hacker News</text>
  <text x="120" y="194" text-anchor="middle" class="sublabel">Algolia API (filtered by points)</text>

  <rect class="box input" x="30" y="230" width="180" height="60"/>
  <text x="120" y="255" text-anchor="middle" class="label" font-weight="600">GitHub Advisories</text>
  <text x="120" y="274" text-anchor="middle" class="sublabel">hex, npm (configurable)</text>

  <rect class="box input" x="30" y="310" width="180" height="60"/>
  <text x="120" y="335" text-anchor="middle" class="label" font-weight="600">MONITORED_REPOS</text>
  <text x="120" y="354" text-anchor="middle" class="sublabel">lockfiles for exposure</text>

  <rect class="box agent" x="280" y="180" width="200" height="120"/>
  <text x="380" y="208" text-anchor="middle" class="label" font-weight="600">Threat Intel Agent</text>
  <text x="380" y="230" text-anchor="middle" class="sublabel">daily-threat-brief routine</text>
  <text x="380" y="248" text-anchor="middle" class="sublabel">filters by STACK_DESCRIPTION</text>
  <text x="380" y="266" text-anchor="middle" class="sublabel">memory_recall: dedup</text>
  <text x="380" y="282" text-anchor="middle" class="sublabel">past briefs</text>

  <rect class="box output" x="550" y="130" width="180" height="80"/>
  <text x="640" y="158" text-anchor="middle" class="label" font-weight="600">GitHub issue</text>
  <text x="640" y="180" text-anchor="middle" class="sublabel">daily brief on BRIEF_REPO</text>
  <text x="640" y="196" text-anchor="middle" class="sublabel">+ per-CVE exposure issues</text>

  <rect class="box output" x="550" y="240" width="180" height="80"/>
  <text x="640" y="268" text-anchor="middle" class="label" font-weight="600">Slack summary</text>
  <text x="640" y="290" text-anchor="middle" class="sublabel">SLACK_CHANNEL</text>
  <text x="640" y="306" text-anchor="middle" class="sublabel">15 lines max, linked to brief</text>

  <path class="arrow" d="M210 100 C 250 100, 260 220, 280 220"/>
  <path class="arrow" d="M210 180 C 250 180, 260 235, 280 235"/>
  <path class="arrow" d="M210 260 L 280 250"/>
  <path class="arrow" d="M210 340 C 250 340, 260 270, 280 270"/>

  <path class="arrow" d="M480 220 C 510 220, 520 170, 550 170"/>
  <text x="510" y="190" class="arrow-label">file brief</text>

  <path class="arrow" d="M480 260 C 510 260, 520 280, 550 280"/>
  <text x="510" y="280" class="arrow-label">post summary</text>

  <g transform="translate(30, 390)">
    <rect class="box input" x="0" y="0" width="14" height="14"/>
    <text x="22" y="11" class="legend-label">trigger / source</text>
    <rect class="box agent" x="130" y="0" width="14" height="14"/>
    <text x="152" y="11" class="legend-label">agent</text>
    <rect class="box output" x="220" y="0" width="14" height="14"/>
    <text x="242" y="11" class="legend-label">output</text>
  </g>
</svg>
