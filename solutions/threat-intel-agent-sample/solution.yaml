readme: |-
  # Threat Intelligence Agent Sample

  A security intelligence analyst that produces daily threat briefs from monitored feeds.

  ## Architecture

  ![Architecture overview](diagrams/architecture.svg)

  ## What it ships

  - Deployable agent template under `agents/threat-intel-agent-sample.yaml`
  - 4 standalone custom tool template(s) under `tools/`
  - 1 standalone routine template(s) under `routines/`
  - Setup actions embedded directly on the agent and atomic templates

  ## Validate/import

  ```sh
  uv run scripts/sample_tool.py pack solutions/threat-intel-agent-sample
  ```
