<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="title desc">
  <title id="title">Code Review Agent Sample — Architecture</title>
  <desc id="desc">GitHub PR webhook triggers the pr-review routine; the agent reads the diff and called code, dedups via long-term memory, and posts up to 8 inline review comments back to the PR.</desc>
  <style>
    .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; rx: 6; ry: 6; }
    .input { fill: #ecfdf5; stroke: #047857; }
    .agent { fill: #eff6ff; stroke: #1d4ed8; }
    .output { fill: #fef3c7; stroke: #b45309; }
    .label { fill: #111827; }
    .sublabel { fill: #4b5563; font-size: 11px; }
    .arrow { fill: none; stroke: #6b7280; stroke-width: 1.5; marker-end: url(#a); }
    .arrow-label { fill: #4b5563; font-size: 11px; font-style: italic; }
    .title { font-size: 16px; font-weight: 600; fill: #111827; }
    .legend-label { fill: #4b5563; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" class="title">Code Review Agent Sample — Architecture</text>

  <rect class="box input" x="30" y="130" width="180" height="80"/>
  <text x="120" y="158" text-anchor="middle" class="label" font-weight="600">GitHub webhook</text>
  <text x="120" y="178" text-anchor="middle" class="sublabel">pull_request.opened</text>
  <text x="120" y="194" text-anchor="middle" class="sublabel">pull_request.synchronize</text>

  <rect class="box agent" x="270" y="110" width="180" height="120"/>
  <text x="360" y="138" text-anchor="middle" class="label" font-weight="600">Code Review Agent</text>
  <text x="360" y="160" text-anchor="middle" class="sublabel">pr-review routine</text>
  <text x="360" y="178" text-anchor="middle" class="sublabel">5 tools: get_pr_files,</text>
  <text x="360" y="194" text-anchor="middle" class="sublabel">get_repo_file, list_pr_reviews,</text>
  <text x="360" y="210" text-anchor="middle" class="sublabel">create_pr_review, resolve_threads</text>

  <rect class="box input" x="270" y="260" width="180" height="48"/>
  <text x="360" y="282" text-anchor="middle" class="label">Long-term memory</text>
  <text x="360" y="298" text-anchor="middle" class="sublabel">dedup at commit SHA</text>

  <rect class="box output" x="510" y="130" width="180" height="80"/>
  <text x="600" y="158" text-anchor="middle" class="label" font-weight="600">Inline PR review</text>
  <text x="600" y="178" text-anchor="middle" class="sublabel">up to 8 comments anchored</text>
  <text x="600" y="194" text-anchor="middle" class="sublabel">to specific file/line</text>

  <path class="arrow" d="M210 170 L 270 170"/>
  <text x="240" y="162" text-anchor="middle" class="arrow-label">PR event</text>

  <path class="arrow" d="M450 170 L 510 170"/>
  <text x="480" y="162" text-anchor="middle" class="arrow-label">post review</text>

  <path class="arrow" d="M360 260 L 360 230"/>
  <text x="396" y="250" text-anchor="middle" class="arrow-label">check / store</text>

  <g transform="translate(30, 320)">
    <rect class="box input" x="0" y="0" width="14" height="14"/>
    <text x="22" y="11" class="legend-label">trigger / source</text>
    <rect class="box agent" x="130" y="0" width="14" height="14"/>
    <text x="152" y="11" class="legend-label">agent</text>
    <rect class="box output" x="220" y="0" width="14" height="14"/>
    <text x="242" y="11" class="legend-label">output</text>
  </g>
</svg>
