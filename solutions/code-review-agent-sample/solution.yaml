readme: |-
  # Code Review Agent Sample

  A senior engineer that reviews every PR like it's going into production at 3am.

  ## Architecture

  ![Architecture overview](diagrams/architecture.svg)

  ## What it ships

  - Deployable agent template under `agents/code-review-agent-sample.yaml`
  - 5 standalone custom tool template(s) under `tools/`
  - 1 standalone routine template(s) under `routines/`
  - Setup actions embedded directly on the agent and atomic templates

  ## Validate/import

  ```sh
  uv run scripts/sample_tool.py pack solutions/code-review-agent-sample
  ```
