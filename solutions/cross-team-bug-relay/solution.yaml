readme: |
  # Cross-Team Bug Relay

  A demo of ArchAstro's **distributed durable workflows**: one automation
  relays a discovered defect between two teams' agents — the discovering
  team's **Bug Reporter** files it in their tracker, the owning team's
  **Bug Resolver** reproduces and classifies it, and the Reporter applies
  any workaround guidance — with status updates posted to a thread at
  every stage.

  The flow is modeled on real cross-company bug workflows (a team finds a
  defect in a partner's product, files it internally, hands off for
  triage, and closes the loop), but it is deliberately **generic**: no
  issue tracker, vendor, or billing system is assumed. Each agent uses
  whatever tools its installer connects.

  ## Architecture

  ![Architecture overview](diagrams/architecture.svg)

  ## What it ships

  - **Bug Reporter** (`AgentTemplate`) — tracker-side specialist that
    files defects and applies remediation guidance.
  - **Bug Resolver** (`AgentTemplate`) — owning-side specialist that
    reproduces defects and classifies the resolution
    (`attempt_workaround` / `provider_fix` / `wont_fix` /
    `needs_more_info`).
  - **Cross-Team Bug Relay** (`AutomationTemplate`) — an invocable,
    org-level automation wrapping the `bug-relay` WorkflowGraph: two
    embedded-agent stages (three when a workaround is attempted), a
    resolution switch, and conditional thread updates.

  ## Install

  This is a multi-template Solution — install each template, choosing it
  with `template`:

  1. Install **Bug Reporter** and **Bug Resolver** (once per team; for a
     cross-org demo, each org installs its own side).
  2. Install **Cross-Team Bug Relay** — this provisions the automation
     already activated.

  ## Run a relay

  Invoke the automation with the two participants (and an optional
  thread for status updates):

  ```sh
  archastro invoke automation cross-team-bug-relay --payload '{
    "parameters": {
      "title": "Checkout total drops discounts on renewal",
      "details": "Renewal invoices ignore the subscription discount. Error: AmountMismatch (req_abc123). Seen on plan pro-annual since 2026-07-01.",
      "thread": "thr_..."
    },
    "participants": {
      "reporter": "agi_... (Bug Reporter)",
      "resolver": "agi_... (Bug Resolver)"
    }
  }'
  ```

  Each embedded stage parks the run as a leaseable work item on the named
  agent's queue; the agent's harness claims it, does the work, and
  submits a JSON result that resumes the workflow:

  ```sh
  archastro list workflow-work --agent <agent>
  archastro claim workflow-work --agent <agent>
  ```

  ## Cross-org relays

  When the resolver belongs to a different org than the run, assignment
  is fail-closed until the automation's owner publishes an `assign`
  grant naming the assignee:

  ```sh
  archastro update automation cross-team-bug-relay \
    --acl-add agent:<resolver-agent-id>:assign
  ```

