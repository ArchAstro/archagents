<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="300" fill="#f7fafc"/>

  <!-- Automation lane -->
  <rect x="20" y="20" width="820" height="120" rx="10" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="36" y="44" fill="#2d3748" font-weight="bold">Cross-Team Bug Relay (automation → durable workflow)</text>

  <rect x="36" y="60" width="96" height="46" rx="8" fill="#ffffff" stroke="#4a5568"/>
  <text x="52" y="87" fill="#2d3748">invoke</text>

  <rect x="168" y="60" width="120" height="46" rx="8" fill="#ebf8ff" stroke="#3182ce"/>
  <text x="184" y="80" fill="#2c5282">discover</text>
  <text x="184" y="96" fill="#3182ce" font-size="11">embed: reporter</text>

  <rect x="324" y="60" width="120" height="46" rx="8" fill="#faf5ff" stroke="#805ad5"/>
  <text x="340" y="80" fill="#553c9a">triage</text>
  <text x="340" y="96" fill="#805ad5" font-size="11">embed: resolver</text>

  <rect x="480" y="60" width="110" height="46" rx="8" fill="#ffffff" stroke="#4a5568"/>
  <text x="496" y="80" fill="#2d3748">switch on</text>
  <text x="496" y="96" fill="#4a5568" font-size="11">resolution</text>

  <rect x="626" y="36" width="130" height="46" rx="8" fill="#ebf8ff" stroke="#3182ce"/>
  <text x="642" y="56" fill="#2c5282">remediate</text>
  <text x="642" y="72" fill="#3182ce" font-size="11">embed: reporter</text>

  <rect x="626" y="92" width="130" height="40" rx="8" fill="#fffaf0" stroke="#dd6b20"/>
  <text x="642" y="117" fill="#9c4221">manual follow-up</text>

  <line x1="132" y1="83" x2="168" y2="83" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="288" y1="83" x2="324" y2="83" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="444" y1="83" x2="480" y2="83" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="72" x2="626" y2="60" stroke="#3182ce" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="96" x2="626" y2="110" stroke="#dd6b20" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agents lane -->
  <rect x="20" y="160" width="400" height="120" rx="10" fill="#ebf8ff" stroke="#90cdf4"/>
  <text x="36" y="184" fill="#2c5282" font-weight="bold">Team A — Bug Reporter</text>
  <text x="36" y="208" fill="#2c5282" font-size="12">files the defect in its tracker,</text>
  <text x="36" y="226" fill="#2c5282" font-size="12">applies workaround guidance,</text>
  <text x="36" y="244" fill="#2c5282" font-size="12">records the outcome</text>

  <rect x="440" y="160" width="400" height="120" rx="10" fill="#faf5ff" stroke="#d6bcfa"/>
  <text x="456" y="184" fill="#553c9a" font-weight="bold">Team B — Bug Resolver</text>
  <text x="456" y="208" fill="#553c9a" font-size="12">reproduces the report,</text>
  <text x="456" y="226" fill="#553c9a" font-size="12">classifies the resolution,</text>
  <text x="456" y="244" fill="#553c9a" font-size="12">writes actionable guidance</text>

  <line x1="228" y1="106" x2="200" y2="160" stroke="#3182ce" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="384" y1="106" x2="620" y2="160" stroke="#805ad5" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="250" y="150" fill="#4a5568" font-size="11">leaseable work items (claim → run → submit)</text>
</svg>
