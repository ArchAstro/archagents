kind: AgentTemplate
name: Release Notes Bot Sample
description: >-
  Drafts weekly release notes from recently merged pull requests. It groups
  changes by audience-facing impact, skips noise, and files the changelog draft
  as a GitHub issue.
identity: |-
  You draft the weekly changelog. Once a week, you scan the merged PRs
  from the past 7 days and produce a clean, human-readable release
  notes draft.

  ## Workflow

  1. Call `list_merged_prs` with `days=7`
  2. Group the PRs by category:
     - **Highlights**: 1-3 most user-visible / impactful changes (your judgment)
     - **Features**: PRs prefixed with `feat:` or labeled `enhancement`
     - **Fixes**: PRs prefixed with `fix:` or labeled `bug`
     - **Breaking changes**: PRs labeled `breaking-change` or with "BREAKING" in title/body
     - **Internal/maintenance**: `chore:`, `refactor:`, `test:`, `docs:`, `ci:`
  3. For each entry, write 1 sentence describing the user-facing impact
     (NOT the implementation). Use the PR body for context, not just the title.
  4. Skip noise: dependency bumps without behavior changes, formatting-only PRs,
     pure refactors that don't ship behavior
  5. Call `create_github_issue` to file the draft as a GitHub issue with
     labels `[release-notes, draft]` in the BRIEF_REPO

  ## Format the changelog

  ```
  # Release Notes Draft — Week of YYYY-MM-DD

  ## ✨ Highlights
  - <highlight 1> (#1234)
  - <highlight 2> (#5678)

  ## Features
  - <feature> (#1234)

  ## Fixes
  - <fix> (#5678)

  ## Breaking changes
  - <breaking change with migration note> (#9012)

  ## Internal
  - <maintenance> (#1111)

  ---
  *Generated from N merged PRs between YYYY-MM-DD and YYYY-MM-DD.*
  ```

  ## Voice

  - Write for users, not for engineers
  - One sentence per entry
  - Skip implementation details ("rewrote the X module")
  - Highlight impact ("X is now Y times faster", "you can now do Z")
  - For breaking changes, ALWAYS include the migration step

  ## Memory

  After filing the draft, `memory_store` the date range so the next
  run knows where to start. Use collection `"release_notes_runs"`.
tools:
- tool_type: builtin
  builtin_tool_key: long_term_memory
  status: active
- tool_type: builtin
  builtin_tool_key: memory
  status: active
- template_path: tools/list-merged-prs.yaml
- template_path: tools/create-github-issue.yaml
routines:
- name: Participate in conversations
  description: Join threads when added so users can request ad hoc release notes.
  handler_type: preset
  preset_name: participate
  event_type: thread.session.join
  event_config:
    thread.session.join:
      filters: {}
  status: active
- template_path: routines/weekly-release-notes.yaml
installations:
- install_type: memory/long-term
  config: {}
- install_type: archastro/thread
  config: {}
- install_type: integration/github
  config: {}
metadata:
  category: engineering
  version: '1.0'
setup_actions:
- action_type: env_var
  title: Set GITHUB_TOKEN
  description: |-
    GitHub token used by this sample's custom scripts to list merged
    PRs and create draft issues. Prefer a fine-grained PAT with Pull
    requests: read, Issues: read/write, and Metadata: read. A
    classic `repo` token also works but is broader.
  params:
    key: GITHUB_TOKEN
    scope: agent_env_var
    secret: true
    example: ghp_xxxxxxxxxxxx
  verify_config:
    type: secret_present
  dedupe_key: GITHUB_TOKEN
  required: true
  sort_order: 0
- action_type: env_var
  title: Set REPO_OWNER
  description: GitHub org/user that owns the repo to draft notes for.
  params:
    key: REPO_OWNER
    scope: agent_env_var
  verify_config:
    type: secret_present
  dedupe_key: REPO_OWNER
  required: true
  sort_order: 1
- action_type: env_var
  title: Set REPO_NAME
  description: Repo name to scan for merged PRs and to file the draft issue in.
  params:
    key: REPO_NAME
    scope: agent_env_var
  verify_config:
    type: secret_present
  dedupe_key: REPO_NAME
  required: true
  sort_order: 2
- action_type: env_var
  title: Set RELEASE_BRANCH
  description: |-
    Branch to track for "merged" PRs. Defaults to `main` if unset.
  params:
    key: RELEASE_BRANCH
    scope: agent_env_var
  verify_config:
    type: secret_present
  dedupe_key: RELEASE_BRANCH
  required: true
  sort_order: 3
- action_type: install
  title: 'Install: integration/github'
  description: |-
    Install the ArchAstro GitHub App on `REPO_OWNER/REPO_NAME`.
    Without this, the repo is not enabled for ArchAgents GitHub
    integration events and tools.
  params:
    installation_kind: integration/github
  verify_config:
    type: installation_active
  dedupe_key: integration/github
  required: true
  sort_order: 4
- action_type: custom
  title: Verify the bot can read merged PRs
  description: |-
    Hits `/repos/{REPO_OWNER}/{REPO_NAME}/pulls?state=closed&base={RELEASE_BRANCH}`
    with `GITHUB_TOKEN` to confirm the bot can list merged PRs on
    the configured branch.
  params:
    id: verify-merged-prs-readable
  verify_config:
    type: script_ref
    script_ref: verify-merged-prs-readable
  dedupe_key: verify-merged-prs-readable
  required: true
  sort_order: 5
  depends_on:
  - GITHUB_TOKEN
  - REPO_OWNER
  - REPO_NAME
