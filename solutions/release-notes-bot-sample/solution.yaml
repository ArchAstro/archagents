readme: |-
  # Release Notes Bot Sample

  Drafts the weekly changelog by scanning merged PRs on a schedule.

  ## Architecture

  ![Architecture overview](diagrams/architecture.svg)

  ## What it ships

  - Deployable agent template under `agents/release-notes-bot-sample.yaml`
  - 2 standalone custom tool template(s) under `tools/`
  - 1 standalone routine template(s) under `routines/`
  - Setup actions embedded directly on the agent and atomic templates

  ## Validate/import

  ```sh
  uv run scripts/sample_tool.py pack solutions/release-notes-bot-sample
  ```
