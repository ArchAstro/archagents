readme: |-
  # Compliance Reviewer Sample

  Reviews pull requests against compliance rules — does not review style or bugs.

  ## Architecture

  ![Architecture overview](diagrams/architecture.svg)

  ## What it ships

  - Deployable agent template under `agents/compliance-reviewer-sample.yaml`
  - 4 standalone custom tool template(s) under `tools/`
  - 1 standalone routine template(s) under `routines/`
  - Setup actions embedded directly on the agent and atomic templates

  ## Validate/import

  ```sh
  uv run scripts/sample_tool.py pack solutions/compliance-reviewer-sample
  ```
