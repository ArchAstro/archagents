<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="title desc">
  <title id="title">Compliance Reviewer Sample — Architecture</title>
  <desc id="desc">GitHub PR webhook triggers a compliance review. The agent searches the uploaded rules corpus via knowledge_search and posts inline comments citing the specific rule and standard.</desc>
  <style>
    .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; rx: 6; ry: 6; }
    .input { fill: #ecfdf5; stroke: #047857; }
    .agent { fill: #eff6ff; stroke: #1d4ed8; }
    .output { fill: #fef3c7; stroke: #b45309; }
    .label { fill: #111827; }
    .sublabel { fill: #4b5563; font-size: 11px; }
    .arrow { fill: none; stroke: #6b7280; stroke-width: 1.5; marker-end: url(#a); }
    .arrow-label { fill: #4b5563; font-size: 11px; font-style: italic; }
    .title { font-size: 16px; font-weight: 600; fill: #111827; }
    .legend-label { fill: #4b5563; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" class="title">Compliance Reviewer Sample — Architecture</text>

  <rect class="box input" x="30" y="80" width="180" height="60"/>
  <text x="120" y="105" text-anchor="middle" class="label" font-weight="600">GitHub webhook</text>
  <text x="120" y="124" text-anchor="middle" class="sublabel">pull_request.opened</text>

  <rect class="box input" x="30" y="220" width="180" height="60"/>
  <text x="120" y="245" text-anchor="middle" class="label" font-weight="600">Compliance rules</text>
  <text x="120" y="264" text-anchor="middle" class="sublabel">rules/*.md via knowledge_search</text>

  <rect class="box agent" x="270" y="130" width="180" height="100"/>
  <text x="360" y="158" text-anchor="middle" class="label" font-weight="600">Compliance Reviewer</text>
  <text x="360" y="180" text-anchor="middle" class="sublabel">compliance-review routine</text>
  <text x="360" y="196" text-anchor="middle" class="sublabel">categorizes change:</text>
  <text x="360" y="212" text-anchor="middle" class="sublabel">auth, PII, audit, retention…</text>

  <rect class="box output" x="510" y="130" width="180" height="100"/>
  <text x="600" y="158" text-anchor="middle" class="label" font-weight="600">Inline PR comments</text>
  <text x="600" y="180" text-anchor="middle" class="sublabel">cite rule ID + standard</text>
  <text x="600" y="196" text-anchor="middle" class="sublabel">(SOC2, GDPR, HIPAA…)</text>
  <text x="600" y="212" text-anchor="middle" class="sublabel">silent if no violations</text>

  <path class="arrow" d="M210 110 C 240 110, 240 160, 270 160"/>
  <text x="234" y="130" class="arrow-label">PR event</text>

  <path class="arrow" d="M210 250 C 240 250, 240 200, 270 200"/>
  <text x="234" y="240" class="arrow-label">policy lookup</text>

  <path class="arrow" d="M450 180 L 510 180"/>
  <text x="480" y="172" text-anchor="middle" class="arrow-label">post review</text>

  <g transform="translate(30, 320)">
    <rect class="box input" x="0" y="0" width="14" height="14"/>
    <text x="22" y="11" class="legend-label">trigger / source</text>
    <rect class="box agent" x="130" y="0" width="14" height="14"/>
    <text x="152" y="11" class="legend-label">agent</text>
    <rect class="box output" x="220" y="0" width="14" height="14"/>
    <text x="242" y="11" class="legend-label">output</text>
  </g>
</svg>
