kind: AgentRoutineTemplate
lookup_key: st-routine-daily-dependency-scan
name: daily-dependency-scan
display_name: "Daily Dependency Scan"
description: Scan all monitored repos for vulnerable dependencies and triage
handler_type: preset
preset_name: do_task
event_type: schedule.cron
schedule: 0 8 * * *
preset_config:
  instructions: |
    Run the daily dependency scan.

    For each repo in MONITORED_REPOS:
    1. Call scan_dependencies with the repo and ecosystem
    2. For each finding, follow the triage workflow (Outcome A, B, or C)
    3. Cite policies from knowledge_search where relevant
status: active
setup_actions:
  - action_type: env_var
    title: Set GITHUB_TOKEN
    description: |
      GitHub token used by the scanning tools this routine calls. A
      fine-grained PAT with `Contents: read`, `Pull requests:
      read/write`, `Issues: read/write`, and `Metadata: read` is
      sufficient.
    params:
      key: GITHUB_TOKEN
      scope: agent_env_var
      secret: true
      example: ghp_xxxxxxxxxxxx
    verify_config:
      type: secret_present
    required: true
    sort_order: 0
  - action_type: env_var
    title: Set MONITORED_REPOS
    description: |
      Comma-separated `owner/repo` list to scan daily.
      Example: `acme/api,acme/web,acme/infra`.
    params:
      key: MONITORED_REPOS
      scope: agent_env_var
    verify_config:
      type: secret_present
    required: true
    sort_order: 1
  - action_type: install
    title: "Install: integration/github"
    description: |
      Install the ArchAstro GitHub App on every repo in MONITORED_REPOS
      so the scanning tools can read manifests and the auto-fix tools
      can open PRs.
    params:
      installation_kind: integration/github
    verify_config:
      type: installation_active
    required: true
    sort_order: 2
  - action_type: custom
    title: Verify the bot can read every monitored repo
    description: |
      Iterates `MONITORED_REPOS` and hits each repo's
      `/repos/{owner}/{name}` endpoint with `GITHUB_TOKEN` to confirm
      access. Surfaces any repos the bot can't see.
    params:
      id: st-verify-monitored-repos-access
    verify_config:
      type: script_ref
      script_ref: st-verify-monitored-repos-access
    required: true
    sort_order: 3
    depends_on:
      - GITHUB_TOKEN
      - MONITORED_REPOS
