kind: AgentToolTemplate
lookup_key: st-tool-commit-file
tool_type: custom
name: commit_file
display_name: "Commit File"
description: Create or update a file on a branch via the GitHub API
parameters:
  type: object
  properties:
    owner:
      type: string
    repo:
      type: string
    branch:
      type: string
    path:
      type: string
    content:
      type: string
    message:
      type: string
  required:
    - owner
    - repo
    - branch
    - path
    - content
    - message
handler_type: script
config_ref: st-commit-file
status: active
setup_actions:
  - action_type: env_var
    title: Set GITHUB_TOKEN
    description: |
      GitHub token with `Contents: read/write` on the target repos.
    params:
      key: GITHUB_TOKEN
      scope: agent_env_var
      secret: true
      example: ghp_xxxxxxxxxxxx
    verify_config:
      type: secret_present
    required: true
    sort_order: 0
  - action_type: install
    title: "Install: integration/github"
    description: Install the ArchAstro GitHub App on the target repos.
    params:
      installation_kind: integration/github
    verify_config:
      type: installation_active
    required: true
    sort_order: 1
