kind: AgentToolTemplate
lookup_key: st-tool-create-pull-request
tool_type: custom
name: create_pull_request
display_name: "Create Pull Request"
description: Open a pull request from a branch
parameters:
  type: object
  properties:
    owner:
      type: string
    repo:
      type: string
    title:
      type: string
    body:
      type: string
    head:
      type: string
      description: Source branch
    base:
      type: string
      description: Target branch
      default: main
  required:
    - owner
    - repo
    - title
    - head
handler_type: script
config_ref: st-create-pull-request
status: active
setup_actions:
  - action_type: env_var
    title: Set GITHUB_TOKEN
    description: |
      GitHub token with `Pull requests: read/write` on the target repos.
    params:
      key: GITHUB_TOKEN
      scope: agent_env_var
      secret: true
      example: ghp_xxxxxxxxxxxx
    verify_config:
      type: secret_present
    dedupe_key: GITHUB_TOKEN
    required: true
    sort_order: 0
  - action_type: install
    title: "Install: integration/github"
    description: Install the ArchAstro GitHub App on the target repos.
    params:
      installation_kind: integration/github
    verify_config:
      type: installation_active
    dedupe_key: integration/github
    required: true
    sort_order: 1
