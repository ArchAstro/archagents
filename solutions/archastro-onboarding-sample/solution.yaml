  # ArchAstro Onboarding Sample

  Guides a new user through setting up their first agent in ArchAstro.

  ## Architecture

  ![Architecture overview](diagrams/architecture.svg)

  ## What it ships

  - Deployable agent template under `agents/archastro-onboarding-sample.yaml`
  - 1 standalone custom tool template(s) under `tools/`
  - Setup actions embedded directly on the agent and atomic templates

  ## Validate/import

  ```sh
  uv run scripts/sample_tool.py pack solutions/archastro-onboarding-sample
  ```
