<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="title desc">
  <title id="title">ArchAstro Onboarding Sample — Architecture</title>
  <desc id="desc">The app provisions an onboarding agent via createAgentAction. The agent fetches docs, runs the onboarding skill in a backing thread, and authors the user's first agent config.</desc>
  <style>
    .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; rx: 6; ry: 6; }
    .input { fill: #ecfdf5; stroke: #047857; }
    .agent { fill: #eff6ff; stroke: #1d4ed8; }
    .output { fill: #fef3c7; stroke: #b45309; }
    .label { fill: #111827; }
    .sublabel { fill: #4b5563; font-size: 11px; }
    .arrow { fill: none; stroke: #6b7280; stroke-width: 1.5; marker-end: url(#a); }
    .arrow-label { fill: #4b5563; font-size: 11px; font-style: italic; }
    .title { font-size: 16px; font-weight: 600; fill: #111827; }
    .legend-label { fill: #4b5563; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" class="title">ArchAstro Onboarding Sample — Architecture</text>

  <rect class="box input" x="30" y="80" width="180" height="60"/>
  <text x="120" y="105" text-anchor="middle" class="label" font-weight="600">App onboarding flow</text>
  <text x="120" y="124" text-anchor="middle" class="sublabel">createAgentAction</text>

  <rect class="box input" x="30" y="220" width="180" height="60"/>
  <text x="120" y="245" text-anchor="middle" class="label" font-weight="600">docs.archagents.com</text>
  <text x="120" y="264" text-anchor="middle" class="sublabel">docs-fetch tool</text>

  <rect class="box agent" x="270" y="130" width="180" height="100"/>
  <text x="360" y="158" text-anchor="middle" class="label" font-weight="600">Onboarding agent</text>
  <text x="360" y="180" text-anchor="middle" class="sublabel">archastro-onboarding skill</text>
  <text x="360" y="196" text-anchor="middle" class="sublabel">15 support skills loaded</text>
  <text x="360" y="212" text-anchor="middle" class="sublabel">on demand</text>

  <rect class="box output" x="510" y="80" width="180" height="60"/>
  <text x="600" y="105" text-anchor="middle" class="label">Setup conversation</text>
  <text x="600" y="124" text-anchor="middle" class="sublabel">in backing thread</text>

  <rect class="box output" x="510" y="220" width="180" height="60"/>
  <text x="600" y="245" text-anchor="middle" class="label">User's first agent</text>
  <text x="600" y="264" text-anchor="middle" class="sublabel">deployed + confirmed</text>

  <path class="arrow" d="M210 110 C 240 110, 240 160, 270 160"/>
  <text x="246" y="130" class="arrow-label">provisions thread</text>

  <path class="arrow" d="M210 250 C 240 250, 240 200, 270 200"/>
  <text x="246" y="240" class="arrow-label">fetch docs</text>

  <path class="arrow" d="M450 160 C 480 160, 480 110, 510 110"/>
  <text x="478" y="130" class="arrow-label">reply</text>

  <path class="arrow" d="M450 200 C 480 200, 480 250, 510 250"/>
  <text x="478" y="240" class="arrow-label">deploys</text>

  <g transform="translate(30, 320)">
    <rect class="box input" x="0" y="0" width="14" height="14"/>
    <text x="22" y="11" class="legend-label">trigger / source</text>
    <rect class="box agent" x="130" y="0" width="14" height="14"/>
    <text x="152" y="11" class="legend-label">agent</text>
    <rect class="box output" x="220" y="0" width="14" height="14"/>
    <text x="242" y="11" class="legend-label">output</text>
  </g>
</svg>
